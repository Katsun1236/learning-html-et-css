<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sanctuaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond squircle sombre façon temple numérique -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#sanctuaryBg)" stroke="url(#goldGlow)" stroke-width="2.5"/>

  <!-- Balise ouvrante < en cyan lumineux -->
  <path d="M 22 21 L 12 32 L 22 43" fill="none" stroke="url(#cyanCore)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Barre oblique / en or sacré -->
  <line x1="37" y1="17" x2="27" y2="47" stroke="url(#goldGlow)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Balise fermante > en cyan lumineux -->
  <path d="M 42 21 L 52 32 L 42 43" fill="none" stroke="url(#cyanCore)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Étoile d'or au sommet du phare -->
  <circle cx="37" cy="17" r="2.2" fill="#fef08a"/>
</svg>
